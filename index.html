<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>三角洲护航</title>
<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#111;
  color:white;
}
.header{
  padding:30px 20px;
  background:#1b1b1b;
}
.header h1{
  margin:0;
  font-size:28px;
}
.header p{
  color:#aaa;
}
.btn{
  display:block;
  margin:20px;
  padding:16px;
  background:#d6a84f;
  color:#111;
  text-align:center;
  border-radius:10px;
  font-weight:bold;
}
.card{
  margin:15px 20px;
  padding:18px;
  background:#202020;
  border-radius:12px;
}
.price{
  color:#e4b85c;
  font-size:20px;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="header">
  <h1>🎮 三角洲护航</h1>
  <p>找到靠谱队友，一起突围</p>
</div>

<div class="btn">＋ 发布护航</div>

<h2 style="margin:20px;">护航大厅</h2>

<div class="card">
  <h3>长弓溪谷 · 摸金护航</h3>
  <p>🕐 今天 20:00</p>
  <p>🎯 带新手熟悉地图</p>
  <p class="price">¥10 / 局</p>
</div>

<div class="card">
  <h3>零号大坝 · 战斗护航</h3>
  <p>🕐 今天 21:30</p>
  <p>🎯 高难度任务协助</p>
  <p class="price">¥20 / 局</p>
</div>

</body>
</html>
